name: Build DawaCare Stock Taking APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rebuild Android project structure
        run: |
          mkdir -p app/src/main/java/com/dawacare/stocktaking
          mkdir -p app/src/main/res/values

          mv MainActivity.kt app/src/main/java/com/dawacare/stocktaking/MainActivity.kt
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv styles.xml app/src/main/res/values/styles.xml

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.dawacare.stocktaking"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.dawacare.stocktaking"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DawaCare-Stock-Taking-APK
          path: app/build/outputs/apk/debug/app-debug.apk
